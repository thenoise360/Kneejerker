<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kneejerker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='content/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='content/favicon.svg') }}" type="image/x-icon">
    <link rel="manifest" href="assets/site.webmanifest">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
</head>
<body>
    <header class="app-header">
        <div class="brand-mini">
            <a href="{{ url_for('home') }}" style="text-decoration: none;">
                <span class="wm">kneejerker</span>
            </a>
        </div>
        <div class="header-status">
            <span class="gw-pill" id="current-gw-pill">GW --</span>
            <span class="deadline" id="deadline">Deadline in --:--:--</span>
        </div>
    </header>

    <div class="content-container body-content">
        {% block content %}
        <main>
            <!-- Main content that can be overridden in child templates -->
        </main>
        {% endblock %}
    </div>
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; {{ year }} - Kneejerker</p>
        </div>
    </footer>

    <!-- Include Popper.js and Bootstrap JS (use CDN for simplicity) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Other dependencies -->
    <script src="{{ url_for('static', filename='scripts/jquery-1.10.2.js') }}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>

    <!-- layout.html: remove the global SDK include -->
    <script>
        window.MIXPANEL_TOKEN = "{{ config.get('MIXPANEL_TOKEN', '') }}";
    </script>
    <script src="{{ url_for('static', filename='scripts/analytics.js') }}" type="module"></script>
  


    <!-- Custom Scripts -->
    <script src="{{ url_for('static', filename='scripts/script.js') }}"></script>
    


    <!-- Cookie consent scripts-->
    <script>
        function hasConsent() {
            return localStorage.getItem("analyticsConsent") === "true";
        }
    
        function getConsentCookie() {
            const match = document.cookie.match(/(^| )analyticsConsent=([^;]+)/);
            return match ? match[2] : null;
        }
    
        function setConsent(granted) {
            localStorage.setItem("analyticsConsent", granted ? "true" : "false");
            const expiry = new Date();
            expiry.setTime(expiry.getTime() + (90 * 24 * 60 * 60 * 1000)); // 90 days
            document.cookie = `analyticsConsent=${granted}; path=/; expires=${expiry.toUTCString()}`;
    
            console.log(`✅ Consent ${granted ? 'accepted' : 'declined'} and saved.`);
    
            if (granted) {
                loadAnalytics();
            }
    
            const banner = document.getElementById("cookie-consent-banner");
            if (banner) banner.remove();
        }
    
        function loadAnalytics() {
            console.log("📊 Loading analytics...");
            const script = document.createElement('script');
            script.type = 'module';
            script.src = "/static/scripts/analytics.js";
            document.head.appendChild(script);
        }
    
        function showCookieBanner() {
            if (!document.getElementById("cookie-consent-banner")) {
                const banner = document.createElement("div");
                banner.id = "cookie-consent-banner";
                banner.innerHTML = `
                    <div class="cookie-banner-inner">
                        <span class="cookie-text">
                            We use cookies to improve your experience and analyze traffic.
                        </span>
                        <div class="cookie-buttons">
                            <button onclick="setConsent(true)" class="cookie-button-primary">Accept Analytics</button>
                            <button onclick="setConsent(false)" class="cookie-button-secondary">Decline</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(banner);
            }
        }

        window.addEventListener("load", () => {
            const consentCookie = getConsentCookie();

            if (consentCookie === "true") {
                console.log("✅ Consent previously granted.");
                loadAnalytics();
            } else if (consentCookie === null) {
                console.log("⚠️ No consent cookie found. Showing banner.");
                showCookieBanner();
            } else {
                console.log("❌ Consent declined. Banner hidden.");
            }
        });
    </script>

    <!-- Global Bottom Sheet (Prototype style) -->
    <div class="sheet-backdrop" id="sheet-backdrop">
        <div class="sheet">
            <div class="handle" id="sheet-handle"></div>
            <div id="sheet-content">
                <!-- Content injected by JS -->
            </div>
        </div>
    </div>

    <div class="tabbar">
        <a href="{{ url_for('home') }}" class="tab {% if request.endpoint == 'home' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            Week
        </a>
        <a href="{{ url_for('discovery') }}" class="tab {% if request.endpoint == 'discovery' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Discover
        </a>
        <a href="{{ url_for('radar') }}" class="tab {% if request.endpoint == 'radar' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 019-9M12 3v9l6 3"/><circle cx="12" cy="12" r="9"/></svg>
            Radar
        </a>
        <a href="{{ url_for('clubs') }}" class="tab {% if request.endpoint in ['clubs', 'club'] %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z"/></svg>
            Clubs
        </a>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
