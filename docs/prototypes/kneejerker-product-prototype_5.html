<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kneejerker — product prototype (Alex)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>

  :root{
    --plum:#4B145B; --plum-dark:#350f42; --plum-tint:#6a2a7c;
    --teal:#29C2B2; --pink:#F67CB0; --charcoal:#333333;
    --offwhite:#F9F9F9; --grey:#E5E5E5; --grey-mid:#c9c4cc;
    --success:#2ecc71;
    --font:'Plus Jakarta Sans', sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; font-family:var(--font); background:#e9e4ec; color:var(--charcoal); }

  .stage{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;
    background:
      radial-gradient(circle at 15% 10%, rgba(75,20,91,.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(41,194,178,.12), transparent 40%),
      #e9e4ec;
  }

  .demo-controls{
    position:fixed; top:18px; left:18px; background:#1e1e1e; color:#fff; border-radius:12px;
    padding:12px 14px; font-size:12px; z-index:200; max-width:230px; box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .demo-controls .label{ font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:10px; opacity:.6; margin-bottom:8px; }
  .demo-controls .row{ display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
  .demo-btn{ font-family:var(--font); font-size:11.5px; font-weight:600; background:#333; color:#fff; border:1px solid #555; border-radius:100px; padding:6px 10px; cursor:pointer; }
  .demo-btn.active{ background:var(--teal); border-color:var(--teal); color:#0d3330; }
  .demo-controls .note{ opacity:.55; font-size:10.5px; line-height:1.4; margin-top:6px; }

  .phone{ width:390px; max-width:100%; height:844px; max-height:92vh; background:#000; border-radius:46px; padding:12px; box-shadow:0 30px 70px rgba(75,20,91,.35), 0 4px 14px rgba(0,0,0,.2); position:relative; }
  .screen{ background:var(--offwhite); width:100%; height:100%; border-radius:34px; overflow:hidden; display:flex; flex-direction:column; position:relative; }
  .notch{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:26px; background:#000; border-radius:0 0 16px 16px; z-index:30; }

  .app-header{ padding:38px 20px 14px; background:var(--offwhite); display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--grey); }
  .brand-mini{ display:flex; align-items:center; gap:8px; }
  .brand-mini .wm{ font-size:13px; font-weight:700; letter-spacing:.22em; color:var(--plum); text-transform:lowercase; }
  .gw-pill{ font-size:11px; font-weight:700; color:var(--plum); background:rgba(75,20,91,.08); padding:4px 10px; border-radius:100px; }
  .deadline{ font-size:11px; font-weight:600; color:var(--pink); font-variant-numeric:tabular-nums; }

  .app-body{ flex:1; overflow-y:auto; padding:16px 18px 18px; -webkit-overflow-scrolling:touch; }
  .app-body::-webkit-scrollbar{ width:0; }

  .tabbar{ display:flex; border-top:1px solid var(--grey); background:#fff; }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 0 14px; background:none; border:none; cursor:pointer; color:var(--grey-mid); font-family:var(--font); font-size:10px; font-weight:600; }
  .tab svg{ width:19px; height:19px; }
  .tab.active{ color:var(--plum); }
  .tab.active svg{ stroke:var(--plum); }

  .card{ background:#fff; border:1px solid var(--grey); border-radius:12px; padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(75,20,91,.05); }
  .card h3{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--teal); margin-bottom:8px; }
  .eyebrow-sm{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--pink); margin-bottom:6px; }
  h2.title{ font-size:19px; font-weight:700; line-height:1.25; margin-bottom:4px; }
  p.sub{ font-size:13px; color:#666; line-height:1.5; margin-bottom:10px; }

  .btn{ font-family:var(--font); display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--plum); color:#fff; border:none; border-radius:100px; font-size:14px; font-weight:700; padding:12px 18px; cursor:pointer; transition:transform .15s ease, background .15s ease; width:100%; }
  .btn:hover{ background:var(--plum-tint); }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ background:var(--grey-mid); cursor:default; }
  .btn.secondary{ background:transparent; color:var(--plum); border:1.5px solid var(--plum); }
  .btn.secondary:hover{ background:rgba(75,20,91,.06); }
  .btn.ghost{ background:transparent; color:#666; border:none; font-weight:600; font-size:13px; width:auto; padding:6px 4px; }

  .term{ border-bottom:1.5px dotted var(--plum); color:var(--plum); font-weight:600; cursor:pointer; }

  .pill{ display:inline-block; font-size:11px; font-weight:700; padding:4px 10px; border-radius:100px; background:var(--teal); color:#0d3330; margin-right:6px; }
  .pill.pink{ background:var(--pink); color:#5c1330; }
  .pill.outline{ background:transparent; border:1.5px solid var(--grey-mid); color:#666; }

  .reasons li{ list-style:none; font-size:13px; line-height:1.55; padding-left:18px; position:relative; margin-bottom:6px; color:#444; }
  .reasons li::before{ content:''; position:absolute; left:0; top:7px; width:6px; height:6px; border-radius:50%; background:var(--pink); }

  .accordion-head{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; padding:4px 0; }
  .accordion-head span.chev{ transition:transform .2s ease; display:inline-block; }
  .accordion-item.open .accordion-head span.chev{ transform:rotate(180deg); }
  .accordion-body{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
  .numbers-accordion.open .accordion-body{ max-height:460px; }

  .alt-player{ padding:10px 0; border-top:1px solid var(--grey); }
  .alt-player .name{ font-weight:700; font-size:13.5px; }
  .alt-player .why{ font-size:12.5px; color:#666; margin-top:2px; }
  .flip-hint{ font-size:11.5px; opacity:.6; margin-top:6px; }

  .switch{ width:46px; height:26px; border-radius:100px; background:var(--pink); position:relative; cursor:pointer; transition:background .2s ease; flex-shrink:0; }
  .switch.on{ background:var(--teal); }
  .switch .knob{ position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:left .2s cubic-bezier(.68,-0.4,.4,1.4); }
  .switch.on .knob{ left:23px; }

  .banner{ background:linear-gradient(135deg, var(--plum), var(--plum-tint)); color:#fff; border-radius:12px; padding:16px; margin-bottom:14px; }
  .banner h3{ color:#fff; font-size:14.5px; margin-bottom:6px; text-transform:none; letter-spacing:0; }
  .banner p{ font-size:12.5px; opacity:.9; line-height:1.5; margin-bottom:12px; }
  .banner .btn{ background:#fff; color:var(--plum); }

  .notice{ font-size:11.5px; color:#665570; background:#f3eef5; border:1px solid var(--grey); border-radius:10px; padding:10px 12px; margin-bottom:14px; line-height:1.45; }

  .progress-pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--plum); background:rgba(75,20,91,.08); padding:5px 12px; border-radius:100px; margin-bottom:14px; }

  .action-card{ display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; }
  .action-card .left{ display:flex; align-items:center; gap:12px; min-width:0; }
  .action-icon{ font-size:19px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; background:var(--grey); border-radius:10px; flex-shrink:0; }
  .action-card .t{ font-weight:700; font-size:13.5px; }
  .action-card .d{ font-size:11.5px; color:#777; margin-top:2px; }
  .badge{ font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:100px; white-space:nowrap; flex-shrink:0; }
  .badge.done{ background:var(--teal); color:#0d3330; }
  .badge.pending{ background:var(--grey); color:#777; }

  .choice-card{ border:1.5px solid var(--grey); border-radius:12px; padding:14px; margin-bottom:10px; cursor:pointer; transition:.15s; }
  .choice-card:hover{ border-color:var(--plum-tint); }
  .choice-card.selected{ border-color:var(--plum); background:rgba(75,20,91,.05); }
  .choice-card .t{ font-weight:700; font-size:13.5px; }
  .choice-card .d{ font-size:12px; color:#777; margin-top:3px; }

  .back-row{ margin-bottom:6px; margin-left:-8px; }

  .plan-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:14px 0; border-bottom:1px solid var(--grey); }
  .plan-row:first-child{ border-top:1px solid var(--grey); }
  .plan-row .t{ font-weight:700; font-size:13.5px; }
  .plan-row .d{ font-size:12.5px; color:#777; margin-top:3px; }
  .plan-row .change{ font-size:12px; font-weight:700; color:var(--plum); cursor:pointer; white-space:nowrap; }

  .friend-row{ margin-bottom:14px; }
  .friend-row .top{ display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:5px; }
  .bar-track{ background:var(--grey); border-radius:100px; height:10px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:100px; background:var(--plum); transition:width .6s ease; }
  .bar-fill.me{ background:var(--teal); }
  .friend-note{ font-size:11.5px; color:#777; margin-top:4px; }

  .onboarding{ position:absolute; inset:0; background:var(--plum); color:#fff; display:flex; flex-direction:column; z-index:40; border-radius:34px; }
  .ob-body{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:34px 26px; text-align:center; align-items:center; gap:16px; }
  .ob-dots{ display:flex; gap:6px; justify-content:center; padding-bottom:22px; }
  .ob-dot{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.35); }
  .ob-dot.active{ background:#fff; width:18px; border-radius:4px; transition:.2s; }
  .mode-choice{ display:flex; flex-direction:column; gap:12px; width:100%; margin-top:6px; }
  .mode-card{ border:1.5px solid rgba(255,255,255,.35); border-radius:12px; padding:14px; text-align:left; cursor:pointer; transition:.15s; }
  .mode-card:hover{ background:rgba(255,255,255,.08); }
  .mode-card.selected{ border-color:var(--teal); background:rgba(41,194,178,.15); }
  .mode-card .t{ font-weight:700; font-size:14px; }
  .mode-card .d{ font-size:12px; opacity:.8; margin-top:3px; }

  .sheet-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.4); z-index:50; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .sheet-backdrop.show{ opacity:1; pointer-events:auto; }
  .sheet{ position:absolute; left:0; right:0; bottom:0; max-height:88%; overflow-y:auto; background:#fff; border-radius:20px 20px 0 0; padding:20px 22px 26px; transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1); z-index:51; }
  .sheet-backdrop.show .sheet{ transform:translateY(0); }
  .sheet .handle{ width:36px; height:4px; background:var(--grey); border-radius:100px; margin:0 auto 14px; }
  .sheet h4{ font-size:15px; margin-bottom:8px; color:var(--plum); }
  .sheet p{ font-size:13.5px; line-height:1.55; color:#444; }

  .toast{ position:absolute; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:var(--success); color:#fff; font-size:13px; font-weight:600; padding:10px 16px; border-radius:100px; opacity:0; pointer-events:none; z-index:60; transition:opacity .25s ease, transform .25s ease; white-space:nowrap; max-width:280px; text-overflow:ellipsis; overflow:hidden; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ===== mini carousel (opt-in data, one metric per card) ===== */
  .mini-carousel{ overflow:hidden; }
  .mini-track{ display:flex; transition:transform .3s ease; }
  .mini-card{ flex:0 0 100%; min-width:0; padding-right:6px; }
  .mini-card .mc-title{ font-size:11px; font-weight:700; color:#777; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
  .mini-card .mc-caption{ font-size:13px; color:#444; line-height:1.5; margin-top:10px; }
  .mini-nav{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
  .mini-nav-btn{ width:30px; height:30px; border-radius:50%; border:1.5px solid var(--grey); background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .mini-nav-btn:disabled{ opacity:.3; }
  .mini-dots{ display:flex; gap:5px; }
  .mini-dot{ width:6px; height:6px; border-radius:50%; background:var(--grey); }
  .mini-dot.active{ background:var(--plum); width:16px; border-radius:4px; transition:.2s; }

  .minute-bars{ display:flex; align-items:flex-end; gap:8px; height:70px; position:relative; border-bottom:1px solid var(--grey); }
  .minute-bar{ width:22px; background:var(--teal); border-radius:4px 4px 0 0; }
  .avg-line{ position:absolute; left:0; right:0; border-top:2px dashed var(--grey-mid); }

  .fixture-compare-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .fixture-compare-row .lbl{ font-size:11px; width:78px; color:#777; flex-shrink:0; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
  :focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

  @media (max-width:460px){
    .stage{ padding:0; }
    .phone{ width:100vw; height:100vh; max-height:100vh; border-radius:0; padding:0; }
    .screen{ border-radius:0; }
    .demo-controls{ top:auto; bottom:10px; left:10px; }
  }
</style>
</head>
<body>

<div class="demo-controls">
  <div class="label">Prototype scenario</div>
  <div class="row">
    <button class="demo-btn active" data-scenario="active" id="scn-active">This week</button>
    <button class="demo-btn" data-scenario="returning" id="scn-returning">Returning (missed 3 GWs)</button>
  </div>
  <button class="demo-btn" id="scn-clear-decisions" style="width:100%; margin-bottom:6px;">↺ Clear this week's decisions</button>
  <button class="demo-btn" id="scn-reset" style="width:100%;">↺ Restart onboarding</button>
  <div class="note">These controls aren't part of the product — they let us compare states for review.</div>
</div>

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen">
      <div class="notch"></div>
      <div class="onboarding" id="onboarding"></div>

      <div class="app-header">
        <div class="brand-mini">
          <svg width="26" height="16" viewBox="0 0 150 80" fill="none">
            <path d="M5 44 L28 20 L52 58 L70 12" stroke="#4B145B" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="88" cy="40" r="26" fill="#4B145B"/>
            <line x1="114" y1="40" x2="145" y2="40" stroke="#4B145B" stroke-width="10" stroke-linecap="round"/>
          </svg>
          <span class="wm">kneejerker</span>
        </div>
        <span class="gw-pill">GW14</span>
      </div>
      <div style="padding:0 20px 10px; margin-top:-6px;">
        <span class="deadline" id="deadline">Deadline in --:--:--</span>
      </div>

      <div class="app-body" id="app-body"></div>

      <div class="tabbar">
        <button class="tab active" data-tab="thisweek">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          This Week
        </button>
        <button class="tab" data-tab="compare">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
          Compare
        </button>
        <button class="tab" data-tab="plan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
          Plan
        </button>
        <button class="tab" data-tab="you">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
          You
        </button>
      </div>

      <div class="sheet-backdrop" id="sheet-backdrop">
        <div class="sheet">
          <div class="handle"></div>
          <h4 id="sheet-title">Term</h4>
          <div id="sheet-body"></div>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>

function average(arr){ return arr.reduce((a,b) => a + b, 0) / arr.length; }
function identifyColdest(){
  return SQUAD.map(name => ({ name, n: gamesAboveAverage(RAW_DATA[name].last5, RAW_DATA[name].avg5) }))
    .sort((a,b) => a.n - b.n)[0].name;
}
// If you've already flagged someone to transfer out on the Injuries screen,
// that takes priority over the purely stats-based "coldest player" pick.
function pickTransferOutCandidate(){
  if (state.decisions.injuries){
    const flagged = Object.entries(state.decisions.injuries).find(([, choice]) => choice === 'transfer');
    if (flagged) return { name: flagged[0], fromInjuryFlag: true };
  }
  return { name: identifyColdest(), fromInjuryFlag: false };
}

// Each market target only makes sense as a replacement for its own position —
// a MID shouldn't be offered as cover for a DEF you're moving on.
const TARGETS_BY_POSITION = { DEF: 'Digne', MID: 'Bowen' };

function buildTransferPlan(){
  const pick = pickTransferOutCandidate();
  const primaryPos = RAW_DATA[pick.name].position;
  const primaryTargetKey = TARGETS_BY_POSITION[primaryPos];

  // The "go further" leg comes from a different supported position, so it's
  // never the same swap suggested twice.
  const otherPositions = Object.keys(TARGETS_BY_POSITION).filter(p => p !== primaryPos);
  const secondCandidate = SQUAD
    .filter(n => n !== pick.name && otherPositions.includes(RAW_DATA[n].position))
    .map(n => ({ n, score: gamesAboveAverage(RAW_DATA[n].last5, RAW_DATA[n].avg5) }))
    .sort((a,b) => a.score - b.score)[0];

  return {
    cold: pick.name,
    fromInjuryFlag: pick.fromInjuryFlag,
    target: primaryTargetKey || null,
    secondCold: secondCandidate ? secondCandidate.n : null,
    secondTarget: secondCandidate ? TARGETS_BY_POSITION[RAW_DATA[secondCandidate.n].position] : null
  };
}

/* Availability/discipline risk — each type of risk uses its own signal,
   scaled to the same 3-tier scheme: yellow (50%), orange (75%), red (100%,
   confirmed). No AI judgement call here either — just thresholds on data. */
function assessRisk(name){
  const d = RAW_DATA[name];
  if (d.confirmedOut) return { pct:100, tier:'confirmed', reasons:[d.confirmedOut] };

  let pct = 0;
  const reasons = [];

  if (d.minutes5){
    const last = d.minutes5[d.minutes5.length - 1];
    const priorAvg = average(d.minutes5.slice(0, -1));
    if (last === 0){
      pct = Math.max(pct, 75);
      reasons.push(`Didn't feature at all last game, vs a normal ${Math.round(priorAvg)}-minute average.`);
    } else if (last < priorAvg * 0.75){
      pct = Math.max(pct, 50);
      reasons.push(`Taken off early last game — ${last} mins, vs his normal ${Math.round(priorAvg)}.`);
    }
  }
  if (d.doubt){
    pct = Math.max(pct, 50);
    reasons.push(d.doubt);
  }
  if (d.bookings){
    const recentRate = average(d.bookings.last5Array);
    const seasonRate = d.bookings.season / d.bookings.gamesPlayed;
    if (recentRate > seasonRate * 1.5){
      pct = Math.max(pct, 50);
      reasons.push(`Booked more often recently than his season rate suggests.`);
    }
    if (d.bookings.season >= d.bookings.banAt - 1){
      pct = Math.max(pct, 75);
      reasons.push(`${d.bookings.season} yellow cards this season — one more triggers a ban.`);
    }
  }
  const tier = pct >= 75 ? 'high' : pct >= 50 ? 'medium' : 'low';
  return { pct, tier, reasons: reasons.length ? reasons : ['No real concerns — just keeping an eye on him.'] };
}
function riskColor(tier){
  return tier === 'confirmed' ? '#c0392b' : tier === 'high' ? '#e0781f' : tier === 'medium' ? '#e8b93a' : 'var(--teal)';
}
function fitnessIcons(minutes5){
  return minutes5.map(m => m === 0 ? '❌' : m < 70 ? '🟡' : '✅').join('');
}
function bookingIcons(bookingsArr){
  return bookingsArr.map(b => b ? '🟨' : '⚪').join('');
}
function iconRow(label, icons){
  if (!icons) return '';
  return `<div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
    <span style="font-size:10.5px; color:#888; width:64px; flex-shrink:0;">${label}</span>
    <span style="font-size:15px; letter-spacing:3px;">${icons}</span>
  </div>`;
}

// Position baselines — everything in the carousel compares against these,
// not just against the player's own history.
const POSITION_BASELINES = {
  FWD: { minutesPerGame:75, ppm:9.0 },
  MID: { minutesPerGame:78, ppm:10.5 },
  DEF: { minutesPerGame:82, ppm:11.5 },
  GK:  { minutesPerGame:90, ppm:8.0 }
};
const LEAGUE_AVG_FIXTURE = [3, 3, 3];

/* ================================================================
   METRICS — pure functions, no randomness. Same input, same tier,
   same phrase, every time. That determinism is what lets people
   trust the tone — it never drifts.
   ================================================================ */
function gamesAboveAverage(last5, avg5){ return last5.filter((v,i) => v > avg5[i]).length; }
function consistencyTier(n){ return n >= 4 ? 'steady' : n >= 2 ? 'streaky' : n === 1 ? 'flash' : 'cold'; }

function minutesShare(minutes5){ return (minutes5.reduce((a,b)=>a+b,0) / minutes5.length) / 90; }
function minutesTier(share){ return share >= 0.85 ? 'nailed' : share >= 0.5 ? 'rotation' : 'fringe'; }

function fixtureTrend(diffs){
  if (diffs[diffs.length-1] < diffs[0]) return 'easing';
  if (diffs[diffs.length-1] > diffs[0]) return 'toughening';
  return 'steady';
}
function ownershipDelta(o){
  const delta = +(o.to - o.from).toFixed(1);
  return { delta, direction: delta > 0 ? 'rising' : delta < 0 ? 'falling' : 'flat' };
}
function priceNumeric(priceStr){ return parseFloat(priceStr.replace('£','').replace('m','')); }
function getPlayer(name){ return RAW_DATA[name] || MARKET_TARGETS[name]; }
function computePpm(name){
  const d = getPlayer(name);
  return +(d.seasonPoints / priceNumeric(d.price)).toFixed(1);
}
function ppmTier(name){
  const d = getPlayer(name);
  const diff = computePpm(name) - POSITION_BASELINES[d.position].ppm;
  return diff > 0.5 ? 'above' : diff < -0.5 ? 'below' : 'even';
}
function avgMinutesTier(name){
  const d = getPlayer(name);
  const avg = Math.round(d.minutes5.reduce((a,b)=>a+b,0) / d.minutes5.length);
  const baseline = POSITION_BASELINES[d.position].minutesPerGame;
  return { avg, tier: avg > baseline * 1.1 ? 'above' : avg < baseline * 0.9 ? 'below' : 'even' };
}
function fixtureVsLeagueTier(name){
  const d = getPlayer(name);
  const avg = +(d.fixtureDifficulty3.reduce((a,b)=>a+b,0) / d.fixtureDifficulty3.length).toFixed(1);
  const leagueAvg = +(LEAGUE_AVG_FIXTURE.reduce((a,b)=>a+b,0) / LEAGUE_AVG_FIXTURE.length).toFixed(1);
  return avg < leagueAvg - 0.3 ? 'kinder' : avg > leagueAvg + 0.3 ? 'tougher' : 'similar';
}

/* Player rating, out of 100 — a simple heuristic blend of recent points,
   value, form consistency, and minutes trust, scaled so the single
   strongest player we track (not necessarily true league-wide) gets 100.
   This is illustrative, not a calibrated model — see the note we give you. */
function allKnownPlayers(){ return [...SQUAD, ...Object.keys(MARKET_TARGETS)]; }
function rawRatingScore(name){
  const d = getPlayer(name);
  const n = gamesAboveAverage(d.last5, d.avg5);
  return average(d.last5) * 10 + computePpm(name) * 2 + n * 3 + minutesShare(d.minutes5) * 10;
}
function computePlayerRating(name){
  const maxScore = Math.max(...allKnownPlayers().map(rawRatingScore));
  return Math.max(1, Math.round((rawRatingScore(name) / maxScore) * 100));
}
function groupFixtureTier(names){
  const avgs = names.map(name => average(RAW_DATA[name].fixtureDifficulty3));
  const groupAvg = +average(avgs).toFixed(1);
  const leagueAvg = +average(LEAGUE_AVG_FIXTURE).toFixed(1);
  return { groupAvg, tier: groupAvg < leagueAvg - 0.2 ? 'kinder' : groupAvg > leagueAvg + 0.2 ? 'tougher' : 'similar' };
}

/* Which chip the signals actually point to — checked in priority order.
   Same rule as everywhere else: compute first, write the sentence after. */
function recommendChip(){
  if (UPCOMING_GW_FLAGS.blank) return { value:'free-hit', why:'A blank gameweek is coming up — Free Hit lets you field a full XI just for that week.' };
  if (UPCOMING_GW_FLAGS.double){
    const p = RAW_DATA[UPCOMING_GW_FLAGS.doublePlayer];
    const n = gamesAboveAverage(p.last5, p.avg5);
    if (consistencyTier(n) === 'steady'){
      return { value:'triple-captain', why:`${UPCOMING_GW_FLAGS.doublePlayer} has a double gameweek coming up and is in genuinely good form — a strong week to consider Triple Captain.` };
    }
  }
  const squadN = SQUAD.map(name => gamesAboveAverage(RAW_DATA[name].last5, RAW_DATA[name].avg5));
  if (average(squadN) < 2){
    return { value:'wildcard', why:'Your squad\'s averaged fewer than 2 of 5 recent games above par — that\'s a squad-wide problem a single transfer won\'t fix.' };
  }
  const bench = groupFixtureTier(BENCH);
  if (bench.tier === 'kinder'){
    return { value:'bench-boost', why:'Your bench has an easier run than the league average right now — a fair week to make it count.' };
  }
  return { value:'hold', why:'Nothing in the signals is forcing your hand this week — holding costs you nothing.' };
}

/* ================================================================
   PHRASE BANK — written once, by a human, in brand voice. The
   engine only ever *selects*, never generates free text.
   ================================================================ */
const PHRASES = {
  consistency: {
    steady:  (n) => `Not a one-off — he's beaten the average pick in ${n} of his last 5 games.`,
    streaky: (n) => `A mixed bag lately — ahead of the average in ${n} of his last 5, so it's there, just not every week.`,
    flash:   ()  => `Mostly quiet recently, with one big game doing the heavy lifting — worth watching if it repeats.`,
    cold:    ()  => `Hasn't beaten the average pick once in his last 5 — a genuinely cold patch, not bad luck.`
  },
  minutes: {
    nailed:   () => `Nailed on to start — hasn't missed a minute to rotation recently.`,
    rotation: () => `Started most weeks, but there's some rotation risk creeping in.`,
    fringe:   () => `Minutes aren't guaranteed right now — worth checking team news before the deadline.`
  },
  fixture: {
    easing:     () => `Fixtures are getting kinder over the next 3 gameweeks.`,
    toughening: () => `The run gets tougher over the next 3 gameweeks — a good week to cash in if you're going to.`,
    steady:     () => `A settled run over the next 3 gameweeks — nothing dramatic either way.`
  },
  vsAvgMinutes: {
    above: () => `Playing more minutes than the average for his position.`,
    even:  () => `Playing about as many minutes as the average for his position.`,
    below: () => `Playing fewer minutes than the average for his position — worth watching.`
  },
  vsAvgFixture: {
    kinder:  () => `An easier run than the average team faces right now.`,
    similar: () => `About the same run as everyone else right now.`,
    tougher: () => `A tougher run than the average team faces right now.`
  }
};

function buildFacts(name){
  const d = getPlayer(name);
  const n = gamesAboveAverage(d.last5, d.avg5);
  const cTier = consistencyTier(n);
  const mTier = minutesTier(minutesShare(d.minutes5));
  const fTier = fixtureTrend(d.fixtureDifficulty3);
  return {
    team: d.team, price: d.price,
    facts: [ PHRASES.minutes[mTier](), PHRASES.fixture[fTier](), PHRASES.consistency[cTier](n) ]
  };
}
function buildShortWhy(name){
  const d = getPlayer(name);
  const mTier = minutesTier(minutesShare(d.minutes5));
  if (mTier !== 'nailed') return PHRASES.minutes[mTier]();
  return PHRASES.fixture[fixtureTrend(d.fixtureDifficulty3)]();
}

            That second move needs its own <strong>-4 hit</strong>, which ${breakeven2 ? `breaks even in about ${breakeven2} gameweek${breakeven2 > 1 ? 's' : ''} if the gap holds` : `doesn't clearly pay for itself right now`} — and costs £${bowenGap.toFixed(1)}m, ${bowenGap > bankAfterFirst ? `which is more than the £${bankAfterFirst.toFixed(1)}m you'd have left` : `comfortably inside the £${bankAfterFirst.toFixed(1)}m you'd have left`}.
          </p>
          <button class="btn secondary" style="width:auto; padding:6px 12px; font-size:12px;" data-action="open-compare" data-a="${plan.secondCold}" data-b="${plan.secondTarget}">See why →</button>
        </div>
      `;
    }

    return `
      <div class="card">
        <p class="sub" style="margin-bottom:12px;">You've got <strong>£${BANK.toFixed(1)}m</strong> in the bank.</p>
        ${plan.fromInjuryFlag ? `<p class="sub" style="margin-bottom:12px; color:var(--plum); font-weight:600;">You flagged ${cold} to transfer out on the Injuries screen — starting there.</p>` : ''}

        <h3>Suggested move</h3>
        <div style="display:flex; gap:16px; margin-bottom:10px;">
          <div style="flex:1;">
            <div class="name term" role="button" tabindex="0" data-action="open-player" data-player="${cold}">${cold}</div>
            <div style="font-size:11px; color:#999; margin-top:1px;">${coldD.team}</div>
            <div class="sub" style="margin:4px 0 0;">${coldN}/5 above average · ${coldD.price}</div>
          </div>
          <div style="flex:1;">
            <div class="name term" role="button" tabindex="0" data-action="open-player" data-player="${plan.target}">${plan.target}</div>
            <div style="font-size:11px; color:#999; margin-top:1px;">${target.team}</div>
            <div class="sub" style="margin:4px 0 0;">${targetN}/5 above average · ${target.price}</div>
          </div>
        </div>
        <p class="sub" style="margin-bottom:8px;">${priceDiff <= 0 ? `Actually frees up £${Math.abs(priceDiff).toFixed(1)}m.` : `Costs £${priceDiff.toFixed(1)}m — leaves £${bankAfterFirst.toFixed(1)}m in the bank.`} Free — no hit needed.</p>
        <button class="btn secondary" style="width:auto; padding:6px 12px; font-size:12px;" data-action="open-compare" data-a="${cold}" data-b="${plan.target}">See why →</button>
        ${secondBlock}
      </div>
    `;
  }
  if (key === 'chip'){
    const ns = SQUAD.map(name => gamesAboveAverage(RAW_DATA[name].last5, RAW_DATA[name].avg5));
    const avgN = +(average(ns)).toFixed(1);
    const bench = groupFixtureTier(BENCH);
    const rec = recommendChip();
    const gwNote = UPCOMING_GW_FLAGS.blank
      ? 'A blank gameweek is flagged in the next 3 weeks.'
      : UPCOMING_GW_FLAGS.double
        ? `${UPCOMING_GW_FLAGS.doublePlayer} has a double gameweek coming up.`
        : 'No blank or double gameweek flagged in the next 3 weeks.';
    return `
      <div class="card">
        <h3>This week's signals</h3>
        <ul class="reasons">
          <li>Squad form: averaging ${avgN} of 5 recent games above par${avgN < 2 ? ' — a genuinely rough patch' : ''}.</li>
          <li>Bench fixtures: ${bench.tier === 'kinder' ? 'easier than the league average' : bench.tier === 'tougher' ? 'tougher than the league average' : 'about average'} over the next 3 weeks.</li>
          <li>${gwNote}</li>
          <li>${AVAILABILITY_WATCH.length} availability concern${AVAILABILITY_WATCH.length !== 1 ? 's' : ''} flagged (see Injuries).</li>
        </ul>
        <p class="sub" style="margin-top:10px; margin-bottom:0; font-weight:600; color:var(--plum);">Our lean this week: ${CHOICE_OPTIONS.chip.find(o => o.value === rec.value).label}. ${rec.why}</p>
      </div>
    `;
  }
  return '';
}

function getOptionsFor(key){
  if (key === 'transfers'){
    const plan = buildTransferPlan();
    if (!plan.target){
      return [{ value:'hold', label:'Hold your transfer this week', desc:'No similarly-priced alternative lined up for this position yet — safest to wait.' }];
    }
    const target = MARKET_TARGETS[plan.target];
    const coldD = RAW_DATA[plan.cold];
    const diff = +(average(target.last5) - average(coldD.last5)).toFixed(1);
    const breakeven = diff > 0 ? Math.ceil(4 / diff) : null;
    const opts = [
      { value:'bring-in-free', label:`Bring in ${plan.target} for ${plan.cold} (free transfer)`, desc:'No points cost — the straightforward, similar-price swap.' },
      { value:'bring-in-hit',  label:`Do it now with a -4 hit instead of waiting`, desc: breakeven ? `${plan.target}'s outscored ${plan.cold} by ~${diff} pts/game — a hit breaks even in about ${breakeven} gameweek${breakeven > 1 ? 's' : ''}.` : `The numbers don't clearly favour a hit right now.` }
    ];
    if (plan.secondCold && plan.secondTarget){
      opts.push({ value:'bigger-move', label:`Do both: ${plan.target} now, plus ${plan.secondCold} → ${plan.secondTarget}`, desc:`The ${plan.target} move stays free — the second swap adds a -4 hit on top. See the "want to go further?" note above for whether it pays for itself.` });
    }
    opts.push({ value:'hold', label:'Hold your transfer this week', desc:'Bank it for a blank or double gameweek coming up.' });
    return opts;
  }
  return CHOICE_OPTIONS[key];
}

/* ================================================================
   OPT-IN DATA VISUALS — the "logos" layer, one metric per card,
   swipeable, building to a verdict. Deliberately minimal data-ink:
   no gridlines, no axis chrome. A 2-point ownership move is shown
   as text, not a chart — charting two numbers is decoration.
   ================================================================ */
function buildSparkline(last5, avg5){
  const w = 260, h = 60, pad = 4;
  const all = [...last5, ...avg5];
  const max = Math.max(...all), min = Math.min(...all);
  const x = i => pad + i * ((w - 2*pad) / (last5.length - 1));
  const y = v => (h - pad) - ((v - min) / ((max - min) || 1)) * (h - 2*pad);
  const playerPts = last5.map((v,i) => `${x(i)},${y(v)}`).join(' ');
  const avgPts    = avg5.map((v,i) => `${x(i)},${y(v)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${avgPts}" fill="none" stroke="#c9c4cc" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polyline points="${playerPts}" fill="none" stroke="#29C2B2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
// One shared chart for two players — same axis, same scale, a legend
// instead of two disconnected mini-charts side by side.
function buildComparisonSparkline(nameA, last5A, nameB, last5B){
  const w = 300, h = 70, pad = 6;
  const all = [...last5A, ...last5B];
  const max = Math.max(...all), min = Math.min(...all);
  const len = Math.max(last5A.length, last5B.length);
  const x = i => pad + i * ((w - 2*pad) / (len - 1));
  const y = v => (h - pad) - ((v - min) / ((max - min) || 1)) * (h - 2*pad);
  const ptsA = last5A.map((v,i) => `${x(i)},${y(v)}`).join(' ');
  const ptsB = last5B.map((v,i) => `${x(i)},${y(v)}`).join(' ');
  return `
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <polyline points="${ptsB}" fill="none" stroke="var(--pink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="${ptsA}" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div style="display:flex; gap:16px; margin-top:6px;">
      <div style="display:flex; align-items:center; gap:6px; font-size:12px;"><span style="width:10px; height:10px; border-radius:50%; background:var(--teal); display:inline-block;"></span>${nameA}</div>
      <div style="display:flex; align-items:center; gap:6px; font-size:12px;"><span style="width:10px; height:10px; border-radius:50%; background:var(--pink); display:inline-block;"></span>${nameB}</div>
    </div>
  `;
}
function difficultyColor(n){ return n <= 2 ? '#7fd88f' : n === 3 ? '#c9c4cc' : n === 4 ? '#F67CB0' : '#8f1e46'; }
function buildFixtureRow(diffs){
  return `<div style="display:flex; gap:6px;">${diffs.map(d =>
    `<div title="Difficulty ${d}/5" style="width:14px; height:14px; border-radius:50%; background:${difficultyColor(d)};"></div>`
  ).join('')}</div>`;
}

function buildMiniCards(name){
  const d = getPlayer(name);
  const baseline = POSITION_BASELINES[d.position];
  const maxBar = 90;

  const { avg: avgMinutes, tier: minTier } = avgMinutesTier(name);
  const minutesBarsHtml = d.minutes5.map(m => `<div class="minute-bar" style="height:${(m/maxBar*70).toFixed(0)}px;" title="${m} mins"></div>`).join('');
  const avgLineBottom = (baseline.minutesPerGame / maxBar * 70).toFixed(0);

  const fixTier = fixtureVsLeagueTier(name);
  const n = gamesAboveAverage(d.last5, d.avg5);
  const cTier = consistencyTier(n);
  const od = ownershipDelta(d.ownership);

  const positives = [minTier !== 'below', fixTier !== 'tougher', cTier === 'steady'].filter(Boolean).length;
  const verdict = positives === 3 ? "Every signal points the same way — about as strong a pick as it gets this week."
    : positives === 2 ? "Two of the three signals are in his favour — solid, not a certainty."
    : positives === 1 ? "Only one signal's really backing this pick — more of a gut call."
    : "Not much in the numbers backing this one — a pure instinct play if you go for it.";

  return [
    `<div class="mini-card">
      <div class="mc-title">Minutes, last 5 — vs. ${d.position} average</div>
      <div class="minute-bars"><div class="avg-line" style="bottom:${avgLineBottom}px;"></div>${minutesBarsHtml}</div>
      <div class="mc-caption">${PHRASES.vsAvgMinutes[minTier]()} Averaging ${avgMinutes} mins vs. ${baseline.minutesPerGame} for the position.</div>
    </div>`,
    `<div class="mini-card">
      <div class="mc-title">Fixture run, next 3 — vs. league average</div>
      <div class="fixture-compare-row"><span class="lbl">Him</span>${buildFixtureRow(d.fixtureDifficulty3)}</div>
      <div class="fixture-compare-row"><span class="lbl">League avg</span>${buildFixtureRow(LEAGUE_AVG_FIXTURE)}</div>
      <div class="mc-caption">${PHRASES.vsAvgFixture[fixTier]()}</div>
    </div>`,
    `<div class="mini-card">
      <div class="mc-title">Points, last 5 gameweeks — vs. ${d.position} average</div>
      ${buildSparkline(d.last5, d.avg5)}
      <div class="mc-caption">${PHRASES.consistency[cTier](n)}</div>
    </div>`,
    `<div class="mini-card">
      <div class="mc-title">Ownership trend</div>
      <div style="font-size:24px; font-weight:700; color:${od.direction==='rising'?'var(--teal)':od.direction==='falling'?'var(--pink)':'#777'};">${d.ownership.to}%</div>
      <div class="mc-caption">${od.direction==='rising' ? `Rising from ${d.ownership.from}% — the template's catching on.` : od.direction==='falling' ? `Falling from ${d.ownership.from}% — could be a differential if you stick with him.` : `Steady at around ${d.ownership.from}%.`} This one's about direction, not a position average.</div>
    </div>`,
    `<div class="mini-card">
      <div class="mc-title">Put together</div>
      <div style="display:flex; gap:6px; margin-bottom:4px;">${[0,1,2].map(i => `<div style="width:26px;height:8px;border-radius:4px;background:${i<positives?'var(--teal)':'var(--grey)'};"></div>`).join('')}</div>
      <div class="mc-caption" style="font-weight:600; color:var(--plum);">${verdict}</div>
    </div>`
  ];
}

function disciplineLine(name){
  const d = getPlayer(name);
  if (!d.bookings) return `${name}: no disciplinary concerns right now.`;
  return `${name}: ${d.bookings.season} yellow cards this season${d.bookings.season >= d.bookings.banAt - 1 ? ' — close to a ban.' : '.'}`;
}

function buildCompareCards(a, b){
  const da = getPlayer(a), db = getPlayer(b);
  const nA = gamesAboveAverage(da.last5, da.avg5), nB = gamesAboveAverage(db.last5, db.avg5);
  const ppmA = computePpm(a), ppmB = computePpm(b);
  const minA = avgMinutesTier(a), minB = avgMinutesTier(b);
  const fixA = fixtureVsLeagueTier(a), fixB = fixtureVsLeagueTier(b);

  let scoreA = 0, scoreB = 0;
  if (nA > nB) scoreA++; else if (nB > nA) scoreB++;
  if (ppmA > ppmB) scoreA++; else if (ppmB > ppmA) scoreB++;
  if (fixA === 'kinder') scoreA++; if (fixB === 'kinder') scoreB++;
  const verdict = scoreA === scoreB
    ? `Close call — both have a case here, it comes down to preference.`
    : `${scoreA > scoreB ? a : b} comes out ahead on more of the signals.`;

  return [
    `<div class="mini-card">
      <div class="mc-title">Form, last 5 games</div>
      ${buildComparisonSparkline(a, da.last5, b, db.last5)}
      <div class="mc-caption">${a}: ${nA}/5 above average · ${b}: ${nB}/5 above average</div>
    </div>`,
    `<div class="mini-card">
      <div class="mc-title">Fixtures, next 3 — vs. league average</div>
      <div class="fixture-compare-row"><span class="lbl">${a}</span>${buildFixtureRow(da.fixtureDifficulty3)}</div>
      <div class="fixture-compare-row"><span class="lbl">${b}</span>${buildFixtureRow(db.fixtureDifficulty3)}</div>
      <div class="mc-caption">${fixA === fixB ? 'A similar run for both.' : `${fixA === 'kinder' ? a : b} has the kinder run.`}</div>
    </div>`,
    `<div class="mini-card">
      <div class="mc-title">Value — points per £m</div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
        <div><div style="font-weight:700; font-size:13.5px;">${a}</div><div style="font-size:22px; font-weight:700;">${ppmA}</div></div>
        <div><div style="font-weight:700; font-size:13.5px;">${b}</div><div style="font-size:22px; font-weight:700;">${ppmB}</div></div>
      </div>
      <div class="mc-caption">${ppmA > ppmB ? a : b} gets you more points per million right now.</div>
    </div>`,
    `<div class="mini-card">
      <div class="mc-title">Minutes trust</div>
      <div class="mc-caption">${a}: ${PHRASES.vsAvgMinutes[minA.tier]()}<br><br>${b}: ${PHRASES.vsAvgMinutes[minB.tier]()}</div>
    </div>`,
    `<div class="mini-card">
      <div class="mc-title">Discipline</div>
      <div class="mc-caption">${disciplineLine(a)}<br><br>${disciplineLine(b)}</div>
    </div>`,
    `<div class="mini-card">
      <div class="mc-title">Put together</div>
      <div class="mc-caption" style="font-weight:600; color:var(--plum);">${verdict}</div>
    </div>`
  ];
}

function renderMiniCarousel(){
  const cards = carouselMode === 'compare' ? buildCompareCards(comparePair[0], comparePair[1]) : buildMiniCards(currentPassportPlayer);
  if (miniIndex > cards.length - 1) miniIndex = cards.length - 1;
  if (miniIndex < 0) miniIndex = 0;

  const track = document.getElementById('mini-track');
  const dotsWrap = document.getElementById('mini-dots');
  if (!track) return;
  track.innerHTML = cards.join('');
  track.style.transform = `translateX(-${miniIndex * 100}%)`;
  dotsWrap.innerHTML = cards.map((_,i) => `<div class="mini-dot ${i===miniIndex?'active':''}"></div>`).join('');
  document.getElementById('mini-prev').disabled = miniIndex === 0;
  document.getElementById('mini-next').disabled = miniIndex === cards.length - 1;
}

/* ================================================================
   BOTTOM SHEET — glossary + player passport + head-to-head compare,
   all sharing one sliding-sheet component.
   ================================================================ */
function openGlossary(term){
  sheetTitle.textContent = term;
  sheetBody.innerHTML = `<p>${glossary[term] || 'No definition yet.'}</p>`;
  sheetBackdrop.classList.add('show');
}
function openPlayerPassport(name){
  const raw = getPlayer(name);
  if (!raw){ sheetTitle.textContent = name; sheetBody.innerHTML = `<p>No details yet for this player.</p>`; sheetBackdrop.classList.add('show'); return; }

  carouselMode = 'passport';
  currentPassportPlayer = name;
  miniIndex = 0;
  const p = buildFacts(name);
  const ppm = computePpm(name);
  const ppmT = ppmTier(name);
  const rating = computePlayerRating(name);

  sheetTitle.innerHTML = `
    <span style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
      <span>${name}</span>
      <span style="font-size:12px; font-weight:700; background:var(--plum); color:#fff; padding:4px 9px; border-radius:100px; letter-spacing:0;">${rating}/100</span>
    </span>
  `;
  sheetBody.innerHTML = `
    <div style="display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;">
      <span class="pill">${p.team}</span>
      <span class="pill pink">${p.price}</span>
      <span class="pill ${ppmT === 'above' ? '' : ppmT === 'below' ? 'pink' : 'outline'}">${ppm} pts/£m</span>
    </div>
    <ul class="reasons">${p.facts.map(f => `<li>${f}</li>`).join('')}</ul>
    <div class="accordion-item numbers-accordion" id="numbers-accordion">
      <div class="accordion-head" data-action="toggle-numbers" role="button" tabindex="0" style="margin-top:14px; border-top:1px solid var(--grey); padding-top:12px;">
        <span style="font-size:13px; font-weight:700; color:var(--plum);">Show me the numbers</span>
        <span class="chev">⌄</span>
      </div>
      <div class="accordion-body">
        <div class="mini-carousel" style="padding-top:10px;">
          <div class="mini-track" id="mini-track"></div>
          <div class="mini-nav">
            <button class="mini-nav-btn" id="mini-prev" data-action="mini-prev">‹</button>
            <div class="mini-dots" id="mini-dots"></div>
            <button class="mini-nav-btn" id="mini-next" data-action="mini-next">›</button>
          </div>
        </div>
      </div>
    </div>
  `;
  sheetBackdrop.classList.add('show');
  renderMiniCarousel();
}
function openCompareSheet(a, b){
  carouselMode = 'compare';
  comparePair = [a, b];
  miniIndex = 0;
  sheetTitle.textContent = `${a} vs ${b}`;
  sheetBody.innerHTML = `
    <div class="mini-carousel">
      <div class="mini-track" id="mini-track"></div>
      <div class="mini-nav">
        <button class="mini-nav-btn" id="mini-prev" data-action="mini-prev">‹</button>
        <div class="mini-dots" id="mini-dots"></div>
        <button class="mini-nav-btn" id="mini-next" data-action="mini-next">›</button>
      </div>
    </div>
  `;
  sheetBackdrop.classList.add('show');
  renderMiniCarousel();
}
function closeGlossary(){ sheetBackdrop.classList.remove('show'); }

/* ================================================================
   EVENT DELEGATION — one click listener, data-action driven.
   ================================================================ */
document.getElementById('screen').addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) { if (e.target === sheetBackdrop) closeGlossary(); return; }
  const action = el.dataset.action;

  switch(action){
    case 'ob-next': state.obStep++; render(); break;
    case 'set-mode': state.mode = el.dataset.mode; render(); break;
    case 'ob-finish': state.onboarded = true; render(); break;
    case 'restart-onboarding': state.onboarded = false; state.obStep = 0; render(); break;
    case 'toggle-mode': state.mode = state.mode === 'guided' ? 'instinct' : 'guided'; render(); break;
    case 'toggle-numbers': document.getElementById('numbers-accordion').classList.toggle('open'); break;
    case 'dismiss-returning': state.scenario = 'active'; render(); showToast('Caught up — you\'re good to go'); break;
    case 'open-glossary': openGlossary(el.dataset.term); break;
    case 'open-player': openPlayerPassport(el.dataset.player); break;
    case 'open-compare': openCompareSheet(el.dataset.a, el.dataset.b); break;
    case 'mini-prev': miniIndex -= 1; renderMiniCarousel(); break;
    case 'mini-next': miniIndex += 1; renderMiniCarousel(); break;

    case 'open-action': {
      const key = el.dataset.key;
      state.activeAction = key;
      if (key === 'captaincy'){
        const cur = state.decisions.captaincy;
        state.tempCaptain = cur ? cur.captain : weeklyPick.player;
        state.tempVice = cur ? cur.vice : weeklyPick.alternatives[0];
      } else if (key === 'injuries'){
        state.tempInjuryChoices = state.decisions.injuries ? { ...state.decisions.injuries } : {};
      } else {
        state.tempChoice = state.decisions[key] ? state.decisions[key].value : null;
      }
      render();
      break;
    }
    case 'close-action': state.activeAction = null; state.tempChoice = null; state.tempInjuryChoices = {}; render(); break;
    case 'select-choice': state.tempChoice = el.dataset.value; render(); break;
    case 'set-injury-choice':
      state.tempInjuryChoices[el.dataset.player] = el.dataset.value;
      render();
      break;
    case 'confirm-injuries':
      state.decisions.injuries = { ...state.tempInjuryChoices };
      state.activeAction = null;
      render();
      showToast('Injury plan saved');
      break;
    case 'confirm-choice': {
      const key = el.dataset.key;
      const opt = getOptionsFor(key).find(o => o.value === state.tempChoice);
      if (opt) state.decisions[key] = { value: opt.value, label: opt.label };
      state.activeAction = null; state.tempChoice = null;
      render();
      showToast(`${ACTIONS.find(a => a.key === key).title} — decided`);
      break;
    }
    case 'set-captain':
      if (state.tempVice === el.dataset.player) state.tempVice = state.tempCaptain;
      state.tempCaptain = el.dataset.player;
      render();
      break;
    case 'set-vice':
      if (state.tempCaptain === el.dataset.player) break;
      state.tempVice = el.dataset.player;
      render();
      break;
    case 'confirm-captaincy':
      state.decisions.captaincy = { captain: state.tempCaptain, vice: state.tempVice };
      state.activeAction = null;
      render();
      showToast(`${state.tempCaptain} (C), ${state.tempVice} (VC) — saved to your plan`);
      break;
  }
});

// Generic keyboard support: any role="button"/role="switch" data-action element.
document.getElementById('screen').addEventListener('keydown', (e) => {
  const el = e.target.closest('[role="button"][data-action], [role="switch"][data-action]');
  if (el && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); el.click(); }
});

// Tab bar
tabs.forEach(t => t.addEventListener('click', () => {
  state.tab = t.dataset.tab;
  state.activeAction = null;
  render();
}));

// Demo controls (outside the phone — not part of the product)
document.getElementById('scn-active').addEventListener('click', () => {
  state.scenario = 'active';
  document.getElementById('scn-active').classList.add('active');
  document.getElementById('scn-returning').classList.remove('active');
  render();
});
document.getElementById('scn-returning').addEventListener('click', () => {
  state.scenario = 'returning';
  document.getElementById('scn-returning').classList.add('active');
  document.getElementById('scn-active').classList.remove('active');
  state.tab = 'thisweek'; state.activeAction = null;
  render();
});
document.getElementById('scn-clear-decisions').addEventListener('click', () => {
  state.decisions = { injuries: null, transfers: null, chip: null, captaincy: null };
  render();
});
document.getElementById('scn-reset').addEventListener('click', () => {
  state.onboarded = false; state.obStep = 0; state.activeAction = null;
  render();
});

/* ================================================================
   LIVE DEADLINE COUNTDOWN
   ================================================================ */
const deadline = new Date(Date.now() + (1000*60*60*27) + (1000*60*14));
function pad(n){ return String(n).padStart(2, '0'); }
function tickDeadline(){
  const diff = deadline - new Date();
  if (diff <= 0){ deadlineEl.textContent = 'Deadline passed'; return; }
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  deadlineEl.textContent = `Deadline in ${pad(h)}:${pad(m)}:${pad(s)}`;
}
tickDeadline();
setInterval(tickDeadline, 1000);

render();
</script>
